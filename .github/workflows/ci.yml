name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: dummy-client-id.apps.googleusercontent.com
      NEXT_PUBLIC_CLOUDINARY_URL: https://api.cloudinary.com/v1_1/dummy/image/upload
      NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: solutions-service
      NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET_2: versions-service
      NEXT_PUBLIC_CLOUDINARY_API_KEY: dummy-key
      NEXT_PUBLIC_CLOUDINARY_API_SECRET: dummy-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Typecheck
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Run Vitest suite
        run: NODE_OPTIONS='--no-experimental-webstorage' pnpm vitest run

      - name: Verify Production Build
        run: pnpm build

  docker-build-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker image (Production target)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=dummy-client-id.apps.googleusercontent.com
            NEXT_PUBLIC_CLOUDINARY_URL=https://api.cloudinary.com/v1_1/dummy/image/upload
            NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=solutions-service
            NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET_2=versions-service
          cache-from: type=gha
          cache-to: type=gha,mode=max
