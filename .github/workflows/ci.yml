name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: dummy-client-id.apps.googleusercontent.com
      NEXT_PUBLIC_CLOUDINARY_URL: https://api.cloudinary.com/v1_1/dummy/image/upload
      NEXT_PUBLIC_CLOUDINARY_API_KEY: dummy-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Typecheck
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Run Vitest suite
        run: NODE_OPTIONS='--no-experimental-webstorage' pnpm vitest run

      - name: Verify Production Build
        run: pnpm build

  docker-build-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker image (Production target)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          build-args: |
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=dummy-client-id.apps.googleusercontent.com
            NEXT_PUBLIC_CLOUDINARY_URL=https://api.cloudinary.com/v1_1/dummy/image/upload
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-dokploy-deploy:
    name: Trigger Dokploy deploy
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: [validate-and-test, docker-build-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Dokploy deploy via API
        env:
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          api_url="${DOKPLOY_API_URL%/}/api/application.deploy"
          body_file=$(mktemp)
          http_code=$(curl -sS -o "$body_file" -w "%{http_code}" --max-time 30 \
            -X POST "$api_url" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"applicationId\": \"$DOKPLOY_APPLICATION_ID\"}")
          echo "Dokploy deploy API responded with HTTP $http_code"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Dokploy deploy failed (HTTP $http_code)"
            cat "$body_file"
            rm -f "$body_file"
            exit 1
          fi
          rm -f "$body_file"
